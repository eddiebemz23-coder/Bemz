services:
  postgres:
    image: postgres:16-alpine
    container_name: bemz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bemz
      POSTGRES_PASSWORD: bemz_dev_password
      POSTGRES_DB: bemz_marketplace
    ports:
      - "5432:5432"
    volumes:
      - bemz-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bemz -d bemz_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bemz-pgdata:
